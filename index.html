<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>別所正博｜プロフィール</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
        "Noto Sans JP", sans-serif;
      background:
        radial-gradient(circle at top left, #c9e7ff, transparent 45%),
        radial-gradient(circle at bottom right, #d8f7e5, transparent 45%),
        #f7fafc;
    }

    .profile-card {
      width: min(100%, 680px);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 16px 40px rgba(31, 41, 55, 0.14);
      backdrop-filter: blur(8px);
    }

    .profile-header {
      padding: 48px 40px 36px;
      color: #ffffff;
      text-align: center;
      background: linear-gradient(135deg, #2563eb, #0f766e);
    }

    .profile-header p {
      margin: 0 0 10px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: 0.08em;
    }

    .content {
      padding: 32px 40px 40px;
    }

    .intro {
      margin: 0 0 28px;
      color: #4b5563;
      text-align: center;
      line-height: 1.8;
    }

    .profile-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .profile-list li {
      display: grid;
      grid-template-columns: 7em 1fr;
      gap: 16px;
      align-items: center;
      padding: 18px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .profile-list li:last-child {
      border-bottom: none;
    }

    .label {
      color: #0f766e;
      font-weight: 700;
    }

    .value {
      color: #1f2937;
      font-size: 1.05rem;
    }

    @media (max-width: 480px) {
      .profile-header,
      .content {
        padding-right: 24px;
        padding-left: 24px;
      }

      .profile-list li {
        grid-template-columns: 1fr;
        gap: 6px;
      }
    }
  </style>
</head>

<body>
  <main class="profile-card">
    <header class="profile-header">
      <p>PROFILE</p>
      <h1>別所 正博</h1>
    </header>

    <section class="content">
      <p class="intro">
        東洋大学情報連携学部に所属しています。
      </p>

      <ul class="profile-list">
        <li>
          <span class="label">氏名</span>
          <span class="value">別所正博</span>
        </li>
        <li>
          <span class="label">所属</span>
          <span class="value">東洋大学情報連携学部</span>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
