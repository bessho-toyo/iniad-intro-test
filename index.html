<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>別所正博｜プロフィール</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <style>
    body {
      min-height: 100vh;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
        "Noto Sans JP", sans-serif;
      background:
        radial-gradient(circle at top left, #c9e7ff, transparent 45%),
        radial-gradient(circle at bottom right, #d8f7e5, transparent 45%),
        #f7fafc;
    }

    .profile-card {
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 16px 40px rgba(31, 41, 55, 0.14);
      backdrop-filter: blur(8px);
    }

    .profile-header {
      color: #fff;
      background: linear-gradient(135deg, #2563eb, #0f766e);
    }

    .profile-label {
      letter-spacing: 0.12em;
    }

    .profile-name {
      letter-spacing: 0.08em;
    }

    .intro {
      color: #4b5563;
      line-height: 1.8;
    }

    .profile-list .list-group-item {
      background: transparent;
    }

    .profile-list .label {
      color: #0f766e;
      font-weight: 700;
    }

    @media (max-width: 575.98px) {
      .profile-card {
        border-radius: 16px;
      }

      .profile-header {
        padding: 2rem 1.25rem !important;
      }
    }
  </style>
</head>

<body class="d-flex align-items-center py-4">
  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8 col-xl-7">
        <article class="profile-card">
          <header class="profile-header text-center px-4 py-5">
            <p class="profile-label mb-2 fw-bold">PROFILE</p>
            <h1 class="profile-name display-5 fw-bold mb-0">別所 正博</h1>
          </header>

          <section class="p-4 p-md-5">
            <p class="intro text-center mb-4">
              東洋大学情報連携学部に所属しています。
            </p>

            <ul class="profile-list list-group list-group-flush">
              <li class="list-group-item px-0 py-3">
                <div class="row align-items-center g-2">
                  <div class="col-12 col-sm-3"><span class="label">氏名</span></div>
                  <div class="col-12 col-sm-9"><span>別所正博</span></div>
                </div>
              </li>
              <li class="list-group-item px-0 py-3">
                <div class="row align-items-center g-2">
                  <div class="col-12 col-sm-3"><span class="label">所属</span></div>
                  <div class="col-12 col-sm-9"><span>東洋大学情報連携学部</span></div>
                </div>
              </li>
            </ul>
          </section>
        </article>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
