<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>別所正博｜プロフィール</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <style>
      :root {
        --bg-soft: #f4f7fb;
        --card-bg: rgba(255, 255, 255, 0.9);
        --primary: #2563eb;
        --primary-deep: #1d4ed8;
        --accent: #0f766e;
        --text: #1f2937;
        --muted: #4b5563;
        --line: rgba(148, 163, 184, 0.28);
        --shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
          "Noto Sans JP", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(147, 197, 253, 0.45), transparent 34%),
          radial-gradient(circle at bottom right, rgba(153, 246, 228, 0.4), transparent 30%),
          var(--bg-soft);
      }

      .page-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
      }

      .profile-card {
        width: min(100%, 860px);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 28px;
        background: var(--card-bg);
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      .profile-header {
        position: relative;
        padding: 54px 28px 42px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
        color: #fff;
      }

      .profile-header::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent 55%);
        pointer-events: none;
      }

      .profile-header > * {
        position: relative;
        z-index: 1;
      }

      .profile-badge {
        display: inline-block;
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        font-weight: 700;
        padding: 0.55rem 0.9rem;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .profile-name {
        margin-top: 1rem;
        font-size: clamp(2.1rem, 4vw, 3.3rem);
        letter-spacing: 0.08em;
        font-weight: 800;
      }

      .profile-subtitle {
        margin: 0.9rem 0 0;
        font-size: 1rem;
        opacity: 0.92;
      }

      .profile-body {
        padding: 32px 28px 24px;
      }

      .lead-text {
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.9;
        margin-bottom: 1.75rem;
        text-align: center;
      }

      .info-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .info-card {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(255,255,255,0.65), rgba(248,250,252,0.9));
        padding: 20px 18px;
      }

      .info-label {
        display: block;
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        margin-bottom: 0.75rem;
        text-transform: uppercase;
      }

      .info-value {
        font-size: 1.02rem;
        line-height: 1.7;
        color: var(--text);
      }

      .tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        padding: 0.55rem 0.8rem;
        border-radius: 999px;
        border: 1px solid rgba(37, 99, 235, 0.16);
        background: rgba(37, 99, 235, 0.06);
        color: var(--primary-deep);
        font-size: 0.88rem;
        font-weight: 600;
      }

      @media (max-width: 767.98px) {
        .profile-header {
          padding-top: 42px;
          padding-bottom: 32px;
        }

        .profile-body {
          padding: 26px 18px 18px;
        }

        .lead-text {
          text-align: left;
          font-size: 1rem;
        }

        .info-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <div class="page-shell">
      <main class="profile-card" aria-label="プロフィールカード">
        <header class="profile-header text-center">
          <span class="profile-badge">PROFILE</span>
          <h1 class="profile-name">別所 正博</h1>
          <p class="profile-subtitle">東洋大学情報連携学部に所属しています</p>
        </header>

        <section class="profile-body">
          <p class="lead-text">
            情報技術や学びの幅を広げることに興味を持ち、日々前向きに取り組んでいます。
            学生生活を通して、知識と経験を積みながら、より良い表現や価値を生み出せるように努めています。
          </p>

          <div class="info-grid">
            <article class="info-card">
              <span class="info-label">基本情報</span>
              <div class="info-value">
                <div>氏名：別所正博</div>
                <div>所属：東洋大学情報連携学部</div>
              </div>
            </article>

            <article class="info-card">
              <span class="info-label">興味分野</span>
              <div class="info-value">
                情報や技術を通じて、より便利で心地よい体験を作ることに興味があります。
                <div class="tag-list">
                  <span class="tag">情報</span>
                  <span class="tag">Web</span>
                  <span class="tag">学習</span>
                </div>
              </div>
            </article>
          </div>
        </section>
      </main>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
